name: Semgrep SAST

on:
  push:
    branches:
      - breakshit
  pull_request:
    branches:
      - breakshit

jobs:
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          args: >
            --json
            --output=semgrep.json
            --severity=INFO
            --severity=WARNING
            --severity=ERROR

      - name: Upload Semgrep artifacts
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: |
            semgrep.json
            semgrep.sarif
