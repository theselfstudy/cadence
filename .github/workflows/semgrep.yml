name: Semgrep SAST

on:
  push:
    branches:
      - breakshit
  pull_request:
    branches:
      - breakshit

jobs:
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          generateSarif: true
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"

      - name: Upload Semgrep JSON results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep.json